# Publica la app en GitHub Pages con cada push a main (o a mano desde la pestaña Actions).
# Si algún test falla o hay vulnerabilidades altas, no se publica.
# Las acciones van fijadas por SHA (inmutable); el comentario indica la versión. Dependabot las actualiza.
name: Publicar en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Nada por defecto: cada job pide solo lo que necesita.
permissions: {}

# Una sola publicación a la vez; si llega otra, la anterior en curso se completa.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      # Sin scripts de instalación: ningún paquete que se usa en Linux los necesita.
      - run: npm ci --ignore-scripts
      # Bloquea solo lo que llega al navegador (dependencias de producción: react, react-dom).
      - name: Auditoría de dependencias de producción (bloquea)
        run: npm audit --omit=dev --audit-level=high
      # Herramientas de build (vite y sus dependencias) no se publican: se informa pero no frena el deploy.
      # Ej.: GHSA-fc5q-39xc-vjpf (picomatch, ReDoS, sin versión corregida), solo usado por vite al compilar.
      - name: Auditoría completa (informativa)
        run: npm audit --audit-level=high
        continue-on-error: true
      - run: npm test
      - run: npm run build
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
