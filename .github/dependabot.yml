# Propone por PR las actualizaciones de dependencias y de acciones (incluidos los SHA fijados).
# Nada se mergea solo: cada PR se revisa.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
